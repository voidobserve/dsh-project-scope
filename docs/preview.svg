<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Left: many projects stacked together. Right: one project at a time, with a switcher on top and only its sessions below.">
  <defs>
    <polygon id="caret" points="0,-3.5 3.5,0.5 -3.5,0.5"/>
    <style>
      .panel { fill: #232c3a; stroke: rgba(255,255,255,0.10); stroke-width: 1; }
      .row { fill: #8b98a9; opacity: 0.35; }
      .row-dim { fill: #8b98a9; opacity: 0.18; }
      .pill { fill: rgba(91,157,255,0.16); }
      .row-on { fill: rgba(91,157,255,0.16); }
      .bar { fill: #e6edf3; opacity: 0.55; }
      .bar-on { fill: #e6edf3; opacity: 0.85; }
      .dot { fill: #5b9dff; }
      .dot-warn { fill: #e0a33a; }
      .arrow { fill: none; stroke: #8b98a9; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- many projects -->
  <rect class="panel" x="40" y="40" width="210" height="220" rx="14"/>
  <rect class="row" x="58" y="60" width="120" height="12" rx="6"/>
  <rect class="row-dim" x="58" y="82" width="150" height="12" rx="6"/>
  <rect class="row" x="58" y="104" width="96" height="12" rx="6"/>
  <rect class="row-dim" x="58" y="126" width="140" height="12" rx="6"/>
  <rect class="row" x="58" y="148" width="172" height="12" rx="6"/>
  <rect class="row-dim" x="58" y="170" width="110" height="12" rx="6"/>
  <rect class="row" x="58" y="192" width="132" height="12" rx="6"/>
  <rect class="row-dim" x="58" y="214" width="88" height="12" rx="6"/>

  <!-- transition -->
  <path class="arrow" d="M272 136h64M322 120l16 16-16 16"/>

  <!-- one project -->
  <rect class="panel" x="360" y="40" width="240" height="220" rx="14"/>
  <rect class="pill" x="374" y="52" width="180" height="30" rx="9"/>
  <rect class="bar-on" x="388" y="64" width="74" height="8" rx="4"/>
  <use href="#caret" transform="translate(530,66) rotate(180)" fill="#8b98a9" opacity="0.8"/>
  <rect class="bar" x="568" y="60" width="18" height="3" rx="1.5"/>
  <rect class="bar" x="575.5" y="52.5" width="3" height="18" rx="1.5"/>

  <rect class="row-on" x="370" y="96" width="220" height="30" rx="9"/>
  <circle class="dot" cx="386" cy="111" r="4"/>
  <rect class="bar-on" x="400" y="107" width="118" height="8" rx="4"/>

  <circle cx="386" cy="147" r="4" fill="none" stroke="#8b98a9" stroke-width="2" stroke-dasharray="14 6" opacity="0.8"/>
  <rect class="bar" x="400" y="143" width="92" height="8" rx="4"/>

  <circle class="dot-warn" cx="386" cy="183" r="4"/>
  <rect class="bar" x="400" y="179" width="136" height="8" rx="4"/>

  <rect class="bar" x="400" y="215" width="104" height="8" rx="4"/>
</svg>
